name = "jak-enhanced-reports"
main = "src/index.js"
compatibility_date = "2026-10-01"

# the reports, private (R2 bucket made once with: npx wrangler r2 bucket create jak-enhanced-reports)
[[r2_buckets]]
binding = "REPORTS"
bucket_name = "jak-enhanced-reports"

# ADMIN_KEY (to read the reports) is a secret: npx wrangler secret put ADMIN_KEY
